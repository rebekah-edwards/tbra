name: Tbra
options:
  bundleIdPrefix: app.tbra
  # 26.0, NOT 27.0. Deployment target is a MINIMUM OS, not a build target:
  # setting it to 27 does not give an iOS 27 phone anything, it only excludes
  # every device below 27. Worse, the stable Xcode SDK is 26.5, so a 27.0
  # target produced a binary declaring `minos 27.0 / sdk 26.5` — a minimum
  # above the SDK it was compiled against. App Store Connect cannot process
  # that: builds 8-13 all sat in "Processing" indefinitely with no error and
  # no rejection, while builds 1-7 (target 26.0) completed normally.
  # Rebekah's iOS 27 beta phone runs a 26.0-target build perfectly.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Set HERE, not in project.pbxproj: that file is gitignored and
    # regenerated by xcodegen, so a bump made there is silently reverted on
    # the next generate. Builds 1-7 shipped as marketing 1.0.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "14"
    SWIFT_VERSION: "6.0"
    # Real signing (paid team, cert "Clanker's Mac mini" in the login keychain).
    # Automatic style covers simulator AND device; signing must stay ENABLED so
    # the app gets an application-identifier entitlement — without it the
    # Keychain (auth token storage) fails with errSecMissingEntitlement (-34018).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: E5ZFZ263ET
    CODE_SIGNING_ALLOWED: "YES"

targets:
  Tbra:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # Only the hand-written Swift sources — not README.md / project.yml / Info.plist.
    # NOTE: "*.swift" is top-level ONLY (not "**/*.swift"), so Widgets/ is
    # deliberately excluded here — those sources belong to the extension.
    sources:
      - path: .
        includes:
          - "*.swift"
      # The widget VIEWS only (not TbraWidgets.swift, which carries @main):
      # the debug harness renders the very same views the extension does.
      - path: Widgets/WidgetViews.swift
      # App icon + in-app image sets. MUST be listed: the "*.swift" filter
      # above excludes it, so without this line xcodegen emits a project with
      # no asset catalog at all, actool never runs, and the built app ships
      # with NO CFBundleIcons — the icon goes blank on the home screen. It
      # survived for a while only as stale PNGs left in DerivedData, which
      # masked the problem until a reinstall. (Found 2026-08-13.)
      - path: Assets.xcassets
      # Bundled brand fonts (Plus Jakarta Sans / Outfit / Space Grotesk) —
      # the same OFL families the web app loads via next/font.
      - path: Fonts
    dependencies:
      - target: TbraWidgets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: tbr*a
        # xcodegen otherwise hardcodes CFBundleVersion to "1", so bumping
        # CURRENT_PROJECT_VERSION had NO effect on the uploaded build number.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Without this, TestFlight holds the build for manual export-compliance
        # answers instead of distributing it.
        ITSAppUsesNonExemptEncryption: false
        # MUST live in the plist. The INFOPLIST_KEY_UISupportedInterfaceOrientations
        # build setting below is ignored while GENERATE_INFOPLIST_FILE=NO, so
        # the bundle went up with no orientations and App Store Connect
        # rejected it (90474, 2026-08-14).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Private scheme for widget taps (tbra://book/<slug>, tbra://stats,
        # tbra://goal, tbra://home). Universal links only cover /book/* and
        # /u/*, so the widget's other destinations need this.
        CFBundleURLTypes:
          - CFBundleURLName: app.tbra.ios
            CFBundleURLSchemes:
              - tbra
        UIAppFonts:
          - PlusJakartaSans.ttf
          - Outfit.ttf
          - SpaceGrotesk.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # NOTE: NO NSAppTransportSecurity here. The cleartext exception the
        # dev builds need (simulator → localhost:3000, phone → tailnet IP)
        # lives ONLY in Info-Debug.plist, which the Debug config points at
        # below. This file is what Release/TestFlight ships, and it must stay
        # clean.
        #
        # This split previously lived in project.pbxproj, which is gitignored
        # AND regenerated by xcodegen — so every `xcodegen generate` silently
        # restored arbitrary loads to the Release plist. Keeping it in
        # project.yml is what makes it survive. (Caught 2026-08-13, pre-ship.)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tbra.ios
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Tbra.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      configs:
        # Debug ONLY gets the cleartext-loads plist. Release keeps the clean
        # generated Info.plist.
        Debug:
          INFOPLIST_FILE: Info-Debug.plist

  # Home-screen + Lock Screen widgets. Renders purely from the shared App
  # Group snapshot the app publishes (WidgetPublisher) — see WidgetShared.swift.
  TbraWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Hand-picked: the widget must NOT pull in the app's view tree.
      # WidgetShared/ColorHex are compiled into both targets by design.
      - path: Widgets
      - path: WidgetShared.swift
      - path: ColorHex.swift
      # The widget draws Outfit / Plus Jakarta Sans, so it needs its own copy
      # of the font files — an extension cannot read the host app's bundle.
      - path: Fonts
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # The caption under a widget on the Home Screen comes from the
        # EXTENSION's display name, not the app's — so the widgets can read
        # "The Based Reader App" while the app icon stays "tbr*a". Note this
        # is per-EXTENSION, not per-family: small/medium/large all share it.
        CFBundleDisplayName: The Based Reader App
        UIAppFonts:
          - PlusJakartaSans.ttf
          - Outfit.ttf
          - SpaceGrotesk.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tbra.ios.widgets
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Widgets/TbraWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
