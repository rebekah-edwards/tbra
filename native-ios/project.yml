name: Tbra
options:
  bundleIdPrefix: app.tbra
  # 27.0 — the user's iPhone runs the iOS 27 developer beta (their explicit
  # instruction: do NOT lower this).
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # Real signing (paid team, cert "Clanker's Mac mini" in the login keychain).
    # Automatic style covers simulator AND device; signing must stay ENABLED so
    # the app gets an application-identifier entitlement — without it the
    # Keychain (auth token storage) fails with errSecMissingEntitlement (-34018).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: E5ZFZ263ET
    CODE_SIGNING_ALLOWED: "YES"

targets:
  Tbra:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    # Only the hand-written Swift sources — not README.md / project.yml / Info.plist.
    sources:
      - path: .
        includes:
          - "*.swift"
      # Bundled brand fonts (Plus Jakarta Sans / Outfit / Space Grotesk) —
      # the same OFL families the web app loads via next/font.
      - path: Fonts
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: tbr*a
        UIAppFonts:
          - PlusJakartaSans.ttf
          - Outfit.ttf
          - SpaceGrotesk.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Dev-only ATS: simulator hits cleartext localhost:3000; physical
        # devices hit the Mac's tailnet IP (WireGuard-encrypted transport).
        # ⚠️ NSAllowsArbitraryLoads MUST be removed before any TestFlight /
        # App Store build — tracked in docs/native-parity.md.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tbra.ios
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Tbra.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
